{% extends "base.html" %}

{% block title %}Forgot Password - Purakam{% endblock %}

{% block content %}
<div class="auth-container fade-in">
    <div class="auth-card" style="max-width: 460px; margin: 3rem auto;">

        <div class="text-center" style="margin-bottom: 2rem;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 50%; background: rgba(99, 102, 241, 0.12); border: 2px solid rgba(99, 102, 241, 0.3); margin-bottom: 1.25rem; color: #6366f1;">
                <i data-lucide="key-round" style="width: 36px; height: 36px;"></i>
            </div>
            <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem;">Forgot Password?</h1>
            <p style="font-size: 0.95rem; color: var(--text-secondary); line-height: 1.5;">
                Enter your account email and we'll send you a 6-digit code to reset your password.
            </p>
        </div>

        <form action="{{ url_for('forgot_password') }}" method="POST">
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="name@email.com" value="{{ email or '' }}" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; padding: 1rem; font-size: 1rem; font-weight: 800; border-radius: 16px; background: #22c55e; color: #111827; box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);">
                Send Reset Code ➔
            </button>
        </form>

        <div class="text-center" style="margin-top: 1.8rem; font-size: 0.9rem; color: var(--text-secondary);">
            Remembered your password? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 700;">Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
