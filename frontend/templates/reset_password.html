{% extends "base.html" %}

{% block title %}Reset Password - Purakam{% endblock %}

{% block content %}
<div class="auth-container fade-in">
    <div class="auth-card" style="max-width: 460px; margin: 3rem auto;">

        <div class="text-center" style="margin-bottom: 2rem;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 50%; background: rgba(34, 197, 94, 0.12); border: 2px solid rgba(34, 197, 94, 0.3); margin-bottom: 1.25rem; color: #22c55e;">
                <i data-lucide="shield-check" style="width: 36px; height: 36px;"></i>
            </div>
            <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem;">Reset Your Password</h1>
            <p style="font-size: 0.95rem; color: var(--text-secondary); line-height: 1.5;">
                Enter the 6-digit code we sent to:<br>
                <strong style="color: var(--primary);">{{ email or 'your email' }}</strong>
            </p>
        </div>

        <form action="{{ url_for('reset_password') }}" method="POST">
            <input type="hidden" name="email" value="{{ email }}">

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.6rem; display: block;">
                    Enter 6-Digit Code
                </label>
                <input
                    type="text"
                    name="code"
                    class="form-control"
                    placeholder="e.g. 482910"
                    required
                    maxlength="6"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    pattern="[0-9]{6}"
                    style="font-size: 1.4rem; font-weight: 800; letter-spacing: 6px; text-align: center; font-family: monospace; padding: 1rem; border-radius: 16px; border: 2px solid var(--border);"
                >
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-input" placeholder="At least 6 characters" minlength="6" required>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Re-enter new password" minlength="6" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; padding: 1rem; font-size: 1rem; font-weight: 800; border-radius: 16px; background: #22c55e; color: #111827; box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);">
                Reset Password ➔
            </button>
        </form>

        <div class="text-center" style="margin-top: 1.8rem; font-size: 0.9rem; color: var(--text-secondary);">
            Didn't receive the code?
            <a href="javascript:void(0)" onclick="resendResetCode('{{ email }}')" style="color: var(--primary); font-weight: 700;">Resend Code</a>
        </div>
    </div>
</div>

<script>
async function resendResetCode(emailStr) {
    if (!emailStr) {
        showToast("Email address is missing.", "warning");
        return;
    }
    try {
        const r = await fetch("{{ BACKEND_API_URL }}/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: emailStr })
        });
        if (r.ok) {
            showToast("If an account exists for this email, a new reset code is on its way.", "success");
        } else {
            const data = await r.json().catch(() => ({}));
            showToast(data.detail || "Please wait a moment before requesting another code.", "warning");
        }
    } catch (e) {
        showToast("Failed to resend code.", "danger");
    }
}
</script>
{% endblock %}
